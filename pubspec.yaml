name: sad
description: "ContactE - Your Ultimate Connection Tool"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase - محدث وإضافات جديدة
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  firebase_messaging: ^17.0.0  # إضافة جديدة للإشعارات
  
  # UI & Design
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  awesome_dialog: ^3.2.1
  
  # Navigation & Utilities
  url_launcher: ^6.2.6
  provider: ^6.1.1
  http: ^1.2.1
  
  # إضافات جديدة للميزات المطلوبة
  share_plus: ^13.3.1  # مشاركة البطاقة والمسودات
  #qr_code_scanner: ^1.0.1  # لمسح QR
  qr_flutter: ^4.1.0  # رمز QR للبطاقة الرقمية
  #flutter_local_notifications: ^16.3.0  # للإشعارات المحلية

